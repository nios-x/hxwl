services:
  kafka:
    image: apache/kafka:latest
    ports:
      - 9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL is for other containers, EXTERNAL is for apps running on the host
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 20

  exchange-server:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.exchange
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  ws-server:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.ws-server
    # Each container listens on its own 3001. Only ws-lb is published to the host.
    deploy:
      replicas: 4
    environment:
      KAFKA_BROKER: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure

  ws-lb:
    image: nginx:1.28-alpine
    ports:
      - 3001:3001
    volumes:
      - ./dockerfiles/nginx.ws-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ws-server
    restart: on-failure

  # Collects /metrics from every ws-server container
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      - ./dockerfiles/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - ws-server
    restart: on-failure

  # Charts of what Prometheus collects, at http://localhost:3002
  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - 127.0.0.1:3002:3000
    environment:
      # Only reachable from this computer, so viewing needs no login
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/ws-servers.json
    volumes:
      - ./dockerfiles/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./dockerfiles/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./dockerfiles/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: on-failure

  client:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.client
    ports:
      - 3000:3000
    depends_on:
      - ws-lb
