# Single entry point for the ws-server containers, published on host port 3001

worker_processes auto;

events {
    # A proxied socket uses two connections: one to the browser, one to ws-server
    worker_connections 16384;
}

http {
    upstream ws_servers {
        # Sockets are long-lived, so balance on open connections rather than taking turns
        least_conn;
        # Shares those counts across workers, and is required by "resolve"
        zone ws_servers 64k;
        # Docker's DNS returns one address per container, so re-resolving picks up
        # replaced containers and "docker compose up --scale"
        resolver 127.0.0.11 valid=5s;
        server ws-server:3001 resolve;
    }

    server {
        listen 3001;

        # Server stats are for Prometheus, which reads each container directly
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://ws_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # The 60s default would drop quiet sockets, e.g. while exchange-server is down
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
